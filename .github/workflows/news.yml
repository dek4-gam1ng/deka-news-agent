name: Deka News Research
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */4 * * *'
permissions:
  contents: write
concurrency:
  group: deka-news-research
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find news and send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_agent.py
      - name: Save seen headlines (avoid duplicates)
        run: |
          if git status --porcelain -- seen_news.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git commit -m "Update monitored news fingerprints"
            git push
          fi
