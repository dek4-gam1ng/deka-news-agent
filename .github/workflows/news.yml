name: DEKA JARVIS
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: deka-jarvis
  cancel-in-progress: false
jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor news every 4 hours or manually
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ $(( $(date -u +%-H) % 4 )) -eq 0 ] && [ "$(date -u +%-M)" -ge 15 ] && [ "$(date -u +%-M)" -lt 25 ]; }; then
            python news_agent.py
          else
            echo "News monitoring is not due."
          fi
      - name: Save seen headlines
        if: success()
        run: |
          if git status --porcelain -- seen_news.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            git commit -m "Update monitored news fingerprints"
            git pull --rebase
            git push
          fi
